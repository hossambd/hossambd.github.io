<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d4956a"/>
      <stop offset="60%" stop-color="#b8784f"/>
      <stop offset="100%" stop-color="#8c5a35"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a90d9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a90d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circle">
      <circle cx="200" cy="200" r="195"/>
    </clipPath>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a90d9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#4a90d9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.07" stroke="#4a90d9" stroke-width="0.5" clip-path="url(#circle)">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Glow aura behind figure -->
  <ellipse cx="200" cy="210" rx="110" ry="130" fill="url(#glowGrad)"/>

  <!-- SHIRT / BODY -->
  <ellipse cx="200" cy="370" rx="110" ry="70" fill="url(#shirtGrad)" clip-path="url(#circle)"/>
  <!-- Collar -->
  <path d="M165 305 Q200 330 235 305 L245 340 Q200 355 155 340 Z" fill="#0f1a30"/>
  <!-- Shirt body -->
  <path d="M100 400 Q130 290 155 285 Q200 300 245 285 Q270 290 300 400 Z" fill="#152035" clip-path="url(#circle)"/>
  <!-- Subtle shirt detail -->
  <path d="M185 290 L200 310 L215 290" fill="none" stroke="#1e3050" stroke-width="1.5"/>

  <!-- NECK -->
  <rect x="180" y="268" width="40" height="35" rx="8" fill="url(#faceGrad)"/>
  <!-- Neck shadow -->
  <ellipse cx="200" cy="268" rx="20" ry="5" fill="#8c5a35" opacity="0.4"/>

  <!-- HEAD -->
  <!-- Skull/head shape -->
  <ellipse cx="200" cy="200" rx="72" ry="82" fill="url(#faceGrad)"/>
  <!-- Head shadow left -->
  <ellipse cx="140" cy="205" rx="25" ry="60" fill="#7a4a2a" opacity="0.25" filter="url(#softBlur)"/>
  <!-- Head shadow right -->
  <ellipse cx="262" cy="195" rx="18" ry="55" fill="#7a4a2a" opacity="0.15" filter="url(#softBlur)"/>

  <!-- EAR LEFT -->
  <ellipse cx="129" cy="210" rx="12" ry="16" fill="#c07848"/>
  <ellipse cx="129" cy="210" rx="7" ry="11" fill="#b8784f"/>

  <!-- EAR RIGHT -->
  <ellipse cx="271" cy="210" rx="12" ry="16" fill="#c07848"/>
  <ellipse cx="271" cy="210" rx="7" ry="11" fill="#b8784f"/>

  <!-- HAIR -->
  <ellipse cx="200" cy="140" rx="72" ry="42" fill="#1a1008"/>
  <path d="M128 175 Q130 130 145 115 Q170 95 200 92 Q230 95 255 115 Q270 130 272 175 Q255 145 200 140 Q145 145 128 175 Z" fill="#1a1008"/>
  <!-- Hair highlight -->
  <path d="M165 105 Q185 98 210 100" stroke="#3a2818" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Sideburn left -->
  <path d="M131 175 Q128 195 130 215" stroke="#1a1008" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Sideburn right -->
  <path d="M269 175 Q272 195 270 215" stroke="#1a1008" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- EYEBROWS -->
  <path d="M158 183 Q172 177 186 181" stroke="#1a1008" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M214 181 Q228 177 242 183" stroke="#1a1008" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- EYES -->
  <!-- Eye left -->
  <ellipse cx="172" cy="198" rx="16" ry="11" fill="white"/>
  <ellipse cx="173" cy="199" rx="10" ry="10" fill="#3a2a1a"/>
  <ellipse cx="173" cy="199" rx="6" ry="6" fill="#1a0f08"/>
  <ellipse cx="176" cy="196" rx="2.5" ry="2.5" fill="white" opacity="0.85"/>
  <!-- Eyelid shadow left -->
  <path d="M156 193 Q172 188 188 193" stroke="#b06040" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Eye right -->
  <ellipse cx="228" cy="198" rx="16" ry="11" fill="white"/>
  <ellipse cx="227" cy="199" rx="10" ry="10" fill="#3a2a1a"/>
  <ellipse cx="227" cy="199" rx="6" ry="6" fill="#1a0f08"/>
  <ellipse cx="230" cy="196" rx="2.5" ry="2.5" fill="white" opacity="0.85"/>
  <!-- Eyelid shadow right -->
  <path d="M212 193 Q228 188 244 193" stroke="#b06040" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- NOSE -->
  <path d="M197 210 Q192 228 186 234 Q196 237 214 234 Q208 228 203 210 Z" fill="#a86840" opacity="0.5"/>
  <ellipse cx="188" cy="233" rx="7" ry="4" fill="#8c5030" opacity="0.4"/>
  <ellipse cx="212" cy="233" rx="7" ry="4" fill="#8c5030" opacity="0.4"/>

  <!-- MOUTH -->
  <!-- Upper lip -->
  <path d="M183 252 Q192 248 200 250 Q208 248 217 252" stroke="#8c4a30" stroke-width="2" fill="none"/>
  <!-- Smile / lower lip -->
  <path d="M183 252 Q200 264 217 252" fill="#c06848" opacity="0.7"/>
  <path d="M185 253 Q200 262 215 253" fill="#d07858" opacity="0.4"/>
  <!-- Mouth line -->
  <path d="M185 252 Q200 257 215 252" stroke="#7a3820" stroke-width="1.2" fill="none"/>

  <!-- BEARD / STUBBLE subtle -->
  <ellipse cx="200" cy="258" rx="28" ry="12" fill="#2a1808" opacity="0.15"/>

  <!-- GLASSES (subtle academic touch) -->
  <g opacity="0.0"><!-- reserved -->
  </g>

  <!-- LANYARD / BADGE hint (conference look) -->
  <line x1="200" y1="295" x2="195" y2="330" stroke="#4a90d9" stroke-width="2" opacity="0.5"/>
  <rect x="186" y="330" width="22" height="16" rx="2" fill="#1e3050" stroke="#4a90d9" stroke-width="0.8" opacity="0.6"/>
  <line x1="190" y1="334" x2="204" y2="334" stroke="#4a90d9" stroke-width="1" opacity="0.5"/>
  <line x1="190" y1="337" x2="200" y2="337" stroke="#4a90d9" stroke-width="1" opacity="0.4"/>
  <line x1="190" y1="340" x2="202" y2="340" stroke="#4a90d9" stroke-width="1" opacity="0.4"/>

  <!-- NLP node decoration top left -->
  <g opacity="0.25" filter="url(#glow)">
    <circle cx="55" cy="60" r="4" fill="#4a90d9"/>
    <circle cx="85" cy="45" r="3" fill="#4a90d9"/>
    <circle cx="40" cy="85" r="3" fill="#4a90d9"/>
    <circle cx="75" cy="80" r="2" fill="#4a90d9"/>
    <line x1="55" y1="60" x2="85" y2="45" stroke="#4a90d9" stroke-width="0.8"/>
    <line x1="55" y1="60" x2="40" y2="85" stroke="#4a90d9" stroke-width="0.8"/>
    <line x1="55" y1="60" x2="75" y2="80" stroke="#4a90d9" stroke-width="0.8"/>
    <line x1="85" y1="45" x2="75" y2="80" stroke="#4a90d9" stroke-width="0.8"/>
  </g>

  <!-- NLP node decoration bottom right -->
  <g opacity="0.25" filter="url(#glow)">
    <circle cx="345" cy="340" r="4" fill="#4a90d9"/>
    <circle cx="315" cy="355" r="3" fill="#4a90d9"/>
    <circle cx="360" cy="315" r="3" fill="#4a90d9"/>
    <circle cx="325" cy="320" r="2" fill="#4a90d9"/>
    <line x1="345" y1="340" x2="315" y2="355" stroke="#4a90d9" stroke-width="0.8"/>
    <line x1="345" y1="340" x2="360" y2="315" stroke="#4a90d9" stroke-width="0.8"/>
    <line x1="345" y1="340" x2="325" y2="320" stroke="#4a90d9" stroke-width="0.8"/>
  </g>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#4a90d9" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="200" r="192" fill="none" stroke="#4a90d9" stroke-width="0.4" opacity="0.15"/>
</svg>
